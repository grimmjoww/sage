---
name: hermes
description: >
  Tier 1 adapter for Hermes Agent with full subagent support, parallel execution,
  git worktrees, shell hooks via the agent-hooks/ convention, and slash
  commands. Install = shell-hooks block in config.yaml + allowlist, not
  a plugin marketplace.
version: "1.0.0"
tier: 1
capabilities:
  subagents: true
  parallel-execution: true
  worktrees: true
  hooks: true
  slash-commands: true
  skill-auto-activation: true
  file-system-access: true
command-prefix: "/sage"
install-method: shell-hooks
supported-os: [linux, macos, windows]
---
